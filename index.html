<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Yr Wyddfa via the Llanberis Path 3D Flyover</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

<style>
html,body{margin:0;height:100%;background:#e9eef0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
/* buttons: same look as the peak page route maps (frosted glass, dark icons) */
.fs-btn{position:absolute;z-index:10;width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.6);color:#1c1c1e;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.fs-btn{background:rgba(255,255,255,.75)}}
@media(hover:hover){.fs-btn:hover{background:rgba(56,153,236,.35)}}
.fs-btn:focus{outline:0}
.fs-btn:active{background:rgba(255,255,255,.45)}
.fs-btn svg{fill:none;stroke:#1c1c1e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px;display:block;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))}
.fs-btn svg.solid{fill:#1c1c1e;stroke:none}
.fs-btn.on{background:rgba(236,38,41,.85);border-color:rgba(236,38,41,.9)}
.fs-btn.on svg{stroke:#fff;filter:none}.fs-btn.on svg.solid{fill:#fff}
/* one right-hand column, bottom up: fullscreen, layers, camera, reset, then speed, restart, play */
.r{right:11px}
#b-fs{bottom:49px}#b-lay{bottom:97px}#b-cam{bottom:145px}#b-reset{bottom:193px}#b-speed{bottom:251px}#b-restart{bottom:299px}#b-play{bottom:347px}
#b-play.on{background:rgba(236,38,41,.9);border-color:rgba(236,38,41,.95)}
#b-play svg{width:18px;height:18px}
#b-speed{position:absolute}
#b-speed b{position:absolute;top:-5px;right:-6px;min-width:17px;height:17px;padding:0 3px;box-sizing:border-box;border-radius:999px;background:#ec2629;color:#fff;font:700 9.5px/17px Inter,system-ui,sans-serif;text-align:center}
body.fs .fs-btn{width:50px;height:50px}
body.fs .r{right:20px}
body.fs #b-fs{bottom:50px}body.fs #b-lay{bottom:110px}body.fs #b-cam{bottom:170px}body.fs #b-reset{bottom:230px}body.fs #b-speed{bottom:300px}body.fs #b-restart{bottom:360px}body.fs #b-play{bottom:420px}
.mapboxgl-ctrl-bottom-right{right:0}
#tap-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;padding:8px 14px;border-radius:999px;background:rgba(28,27,27,.78);color:#fff;font:600 12.5px/1 Figtree,Inter,system-ui,sans-serif;pointer-events:none;white-space:nowrap;display:none}
body.lp-locked #tap-hint{display:block}body.fs #tap-hint{display:none!important}

#b-zin,#b-zout{left:11px;right:auto}#b-zin{bottom:97px}#b-zout{bottom:49px}body.fs #b-zin,body.fs #b-zout{left:20px}body.fs #b-zin{bottom:110px}body.fs #b-zout{bottom:50px}

</style>
</head>

<body>
<div id="map"></div>

<div id="tap-hint">Tap the map to explore</div>
<button id="b-zin" class="fs-btn" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
<button id="b-zout" class="fs-btn" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"></path></svg></button>
<button id="b-reset" class="fs-btn r" title="Back to the start view" aria-label="Reset view"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg></button>
<button id="b-cam" class="fs-btn r" title="Switch between 3D and top-down view" aria-label="Switch camera"><svg id="i-3d" viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7z"></path><path d="M3 7l9 5 9-5M12 12v10"></path></svg><svg id="i-2d" viewBox="0 0 24 24" style="display:none"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5z"></path><path d="M9 4v13.5M15 6.5V20"></path></svg></button>
<button id="b-lay" class="fs-btn r" title="Switch to topographic map" aria-label="Switch map layer"><svg viewBox="0 0 24 24"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2"></polygon><polyline points="2 15.5 12 22 22 15.5"></polyline></svg></button>
<button id="b-fs" class="fs-btn r" title="Fullscreen" aria-label="Fullscreen"><svg id="i-exp" viewBox="0 0 24 24"><polyline points="4,9 4,4 9,4"/><polyline points="20,9 20,4 15,4"/><polyline points="4,15 4,20 9,20"/><polyline points="20,15 20,20 15,20"/></svg><svg id="i-col" viewBox="0 0 24 24" style="display:none"><polyline points="4,9 9,9 9,4"/><polyline points="20,9 15,9 15,4"/><polyline points="4,15 9,15 9,20"/><polyline points="20,15 15,15 15,20"/></svg></button>
<button id="b-play" class="fs-btn r" title="Play flyover" aria-label="Play flyover"><svg id="iconPlay" class="solid" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg><svg id="iconPause" class="solid" viewBox="0 0 24 24" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg></button>
<button id="b-restart" class="fs-btn r" title="Back to the start of the route" aria-label="Restart flyover"><svg class="solid" viewBox="0 0 24 24"><rect x="5" y="5" width="2.6" height="14" rx="1"></rect><path d="M19 5.5v13L9 12z"></path></svg></button>
<button id="b-speed" class="fs-btn r" title="Flyover speed" aria-label="Flyover speed 1x"><svg class="solid" viewBox="0 0 24 24"><path d="M3 6v12l8.5-6zM12.5 6v12L21 12z"></path></svg><b>1×</b></button>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.0/dist/togeojson.umd.js"></script>

<script>
mapboxgl.accessToken="pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

const GPX_URL="Snowdon%20Via%20The%20Llanberis%20Path.gpx";   /* the route file next to this page */

/* Fix: behind the walker looking forwards = forward bearing (no 180) */
const BEARING_OFFSET_DEG = 0;

const START_ZOOM=15.7,
      CENTER_SMOOTH=0.06,
      MAX_TURN_RATE=4,
      STEP_KM=0.02;

let currentZoom = START_ZOOM;
let targetZoom  = START_ZOOM;

function forceWhite(svg){
  svg.querySelectorAll("*").forEach(n=>{
    if(n.getAttribute("fill")!=="none") n.setAttribute("fill","#fff");
    if(n.hasAttribute("stroke")) n.setAttribute("stroke","#fff");
  });
}

async function fetchText(u){
  try{const r=await fetch(u);if(r.ok)return await r.text();}catch(e){}
  try{const r=await fetch("https://corsproxy.io/?"+encodeURIComponent(u));if(r.ok)return await r.text();}catch(e){}
  return "";
}
function parseGpx(text){
  const xml=new DOMParser().parseFromString(text,"application/xml");
  return toGeoJSON.gpx(xml).features.find(f=>f.geometry?.type==="LineString");
}
function normBearing(b){
  return ((b % 360) + 360) % 360;
}

let map=null;
/* starting view: looking down on the route (not out at the sky), zoomed out so the whole loop sits in the middle */
const HOME_PITCH=25;
const homePad=()=>{const c=map.getContainer();return {top:c.clientHeight*.14,bottom:c.clientHeight*.14,left:c.clientWidth*.1,right:c.clientWidth*.2};};   // zoomed in closer (Rem); extra right for the buttons

let route=null,routeLen=0,progress=0,playing=false,camMode="follow";
let userOverride=false;
let camCenter=null,camBearing=null,lastTs=0;
let osVisible=false;

async function addArrow(){
  if(map.hasImage("arrow"))return;
  const c=document.createElement("canvas");
  c.width=c.height=64;
  const ctx=c.getContext("2d");
  ctx.translate(32,32);
  ctx.beginPath();
  ctx.moveTo(-6,-12);
  ctx.lineTo(6,0);
  ctx.lineTo(-6,12);
  ctx.strokeStyle="#fff";
  ctx.lineWidth=8;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.stroke();
  map.addImage("arrow",await createImageBitmap(c),{pixelRatio:4});
}

function showCam(){
  document.getElementById("i-3d").style.display = camMode==="follow" ? "block" : "none";
  document.getElementById("i-2d").style.display = camMode==="topdown" ? "block" : "none";
}

function isFullscreen(){
  return document.fullscreenElement || document.webkitFullscreenElement ||
         document.mozFullScreenElement || document.msFullscreenElement;
}

function isIOS(){
  const ua = window.navigator.userAgent || "";
  const platform = window.navigator.platform || "";
  const iOS = /iPad|iPhone|iPod/.test(ua);
  const iPadOS = platform === "MacIntel" && navigator.maxTouchPoints > 1;
  return iOS || iPadOS;
}

/* Detect iOS fullscreen tab via ?fs=1 and set class */
(function(){
  const params = new URLSearchParams(window.location.search);
  if(isIOS() && params.get("fs") === "1"){
    document.body.classList.add("ios-fullscreen","fs");
    const bf = document.getElementById("b-fs");
    if(bf) bf.style.display = "none";
  }
})();

/* Issue 1: load GPX first, compute route centre, then create map */
(async()=>{
  const gpxText = await fetchText(GPX_URL);
  const line = parseGpx(gpxText);

  let initialCenter = [-3.9, 53.05];
  let initialZoom = 13.5;
  let initialBearing = -20;

  if(line){
    const b = turf.bbox(line);
    initialCenter = [(b[0]+b[2])/2, (b[1]+b[3])/2];

    const coords = line.geometry.coordinates || [];
    if(coords.length >= 2){
      const fwd = turf.bearing(turf.point(coords[0]), turf.point(coords[1]));
      initialBearing = normBearing(fwd + BEARING_OFFSET_DEG);
    }
  }

  const COOP=matchMedia("(pointer:coarse)").matches;
  map=new mapboxgl.Map({
    container:"map",
    style:"mapbox://styles/mapbox/satellite-streets-v12",
    center:initialCenter,
    zoom:initialZoom,
    pitch:HOME_PITCH,
    bearing:initialBearing,
    antialias:true,
    attributionControl:false,
    /* phones: one finger scrolls the page, two fingers move the map (off in full screen) */
    cooperativeGestures:false
  });

  if(LP_TOUCH){ lpGestures(false); map.on("click",()=>{ if(!pageFs) setPageFs(true); }); }
  /* COMPACT ATTRIBUTION (Mapbox logo bottom left + info icon) */
  map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-right");

  ["mousedown","touchstart","dragstart","rotatestart","zoomstart","pitchstart"].forEach(ev=>{
    map.on(ev,e=>{
      if(!e.originalEvent) return;
      if(playing && (camMode==="follow"||camMode==="topdown")){
        userOverride=true;
      }
    });
  });

  map.on("load",async()=>{

    map.addSource("mapbox-dem",{type:"raster-dem",url:"mapbox://mapbox.mapbox-terrain-dem-v1"});
    map.setTerrain({source:"mapbox-dem",exaggeration:1});
    map.addLayer({id:"sky",type:"sky",
      paint:{"sky-type":"atmosphere","sky-atmosphere-sun-intensity":12}
    });

    map.addSource("os-topo",{
      type:"raster",
      tiles:[
        "https://a.tile.opentopomap.org/{z}/{x}/{y}.png",
        "https://b.tile.opentopomap.org/{z}/{x}/{y}.png",
        "https://c.tile.opentopomap.org/{z}/{x}/{y}.png"
      ],
      tileSize:256,
      maxzoom:17
    });
    map.addLayer({
      id:"os-topo-layer",
      type:"raster",
      source:"os-topo",
      layout:{ visibility:"none" },
      paint:{}
    });

    map.addSource("route",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#fff","line-width":11,"line-opacity":0.95}});
    map.addLayer({
      id:"route-line",
      type:"line",
      source:"route",
      paint:{
        "line-color":"#EC2629",
        "line-width":7,
        "line-opacity":0.95
      }
    });

    await addArrow();

    map.addLayer({
      id:"route-arrows",
      type:"symbol",
      source:"route",
      layout:{
        "symbol-placement":"line",
        "symbol-spacing":90,
        "icon-image":"arrow",
        "icon-size":1.4,"icon-pitch-alignment":"map",
        "icon-allow-overlap":true,
        "icon-ignore-placement":true,
        "icon-rotation-alignment":"map",
        "icon-keep-upright":false
      },
      paint:{"icon-opacity":1}
    });

    map.addSource("cursor",{type:"geojson",data:turf.point([0,0])});
    map.addLayer({
      id:"cursor-pt",
      type:"circle",
      source:"cursor",
      paint:{
        "circle-radius":6,
        "circle-color":"#fff",
        "circle-stroke-width":3,
        "circle-stroke-color":"#EC2629"
      }
    });

    if(line&&line.geometry&&line.geometry.coordinates&&line.geometry.coordinates.length){
      const fl=document.createElement('div');fl.title='Start and finish';fl.style.cssText='width:24px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))';
      fl.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 30" width="24" height="30"><path d="M5 28V3" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M5 28V3" stroke="#1c1b1b" stroke-width="2.4" stroke-linecap="round"/><path d="M6.5 3.5h13l-3.2 5 3.2 5h-13z" fill="#ed2629" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><circle cx="5" cy="28" r="2.2" fill="#1c1b1b" stroke="#fff" stroke-width="1.4"/></svg>';
      new mapboxgl.Marker({element:fl,anchor:'bottom-left',offset:[-5,2]}).setLngLat(line.geometry.coordinates[0]).addTo(map);
    }
    if(line){
      const len=turf.length(line,{units:"kilometers"});
      const pts=[];
      for(let d=0;d<=len;d+=STEP_KM){
        pts.push(
          turf.along(line,Math.min(d,len),{units:"kilometers"}).geometry.coordinates
        );
      }
      route={type:"Feature",geometry:{type:"LineString",coordinates:pts}};
      routeLen=len;

      map.getSource("route").setData(route);
      map.getSource("cursor").setData(turf.point(pts[0]));

      map.once("idle",()=>{
        const b=turf.bbox(route);

        let fitBearing = initialBearing;
        if(pts.length >= 2){
          const fwd = turf.bearing(turf.point(pts[0]), turf.point(pts[1]));
          fitBearing = normBearing(fwd + BEARING_OFFSET_DEG);
        }

        homeView={b:[[b[0],b[1]],[b[2],b[3]]],bearing:fitBearing};
        map.fitBounds(homeView.b,{
          padding:homePad(),pitch:HOME_PITCH,bearing:fitBearing,duration:0
        });

        currentZoom = START_ZOOM;
        targetZoom  = START_ZOOM;
        camBearing = fitBearing;
      });
    }

    requestAnimationFrame(tick);
  });
})();

let homeView=null;
/* height chart on the hike page: tell the page how far along the flyover is, and let a tap on the chart move it */
let lastSent=0;
function sendProg(force){
  const now=performance.now();
  if(!force && now-lastSent<90) return;
  lastSent=now;
  try{ window.parent.postMessage({type:"lpProg", f: routeLen? progress/routeLen : 0}, "*"); }catch(e){}
}
window.addEventListener("message",e=>{
  const d=e.data||{};
  if(d.type==="lpFsOff" && pageFs){ setPageFs(false); return; }
  if(d.type==="lpSeek" && route && map && typeof d.f==="number"){
    progress=Math.max(0,Math.min(1,d.f))*routeLen;
    const pos=turf.along(route,progress,{units:"kilometers"}).geometry.coordinates;
    map.getSource("cursor").setData(turf.point(pos));
    camCenter=null;camBearing=null;userOverride=false;
    if(!playing) map.easeTo({center:pos,duration:600});
    sendProg(true);
  }
});
const SPEEDS=[[1,0.35],[2,0.7],[4,1.4],[8,2.8]];
let speedIx=0;

function setPlaying(v){
  playing=v;
  if(playing){
    userOverride=false;camCenter=null;camBearing=null;
    currentZoom=START_ZOOM;targetZoom=START_ZOOM;
  }
  document.getElementById("iconPlay").style.display = playing ? "none" : "block";
  document.getElementById("iconPause").style.display = playing ? "block" : "none";
  document.getElementById("b-play").setAttribute("aria-label", playing ? "Pause flyover" : "Play flyover");
  document.getElementById("b-play").classList.toggle("on",playing);
}
document.getElementById("b-play").onclick=()=>setPlaying(!playing);

document.getElementById("b-restart").onclick=()=>{
  if(!route || !map) return;
  progress=0;
  map.getSource("cursor").setData(turf.point(route.geometry.coordinates[0]));
  camCenter=null;camBearing=null;currentZoom=START_ZOOM;targetZoom=START_ZOOM;
  userOverride=false;
  sendProg(true);
};

document.getElementById("b-speed").onclick=function(){
  speedIx=(speedIx+1)%SPEEDS.length;
  this.querySelector("b").textContent=SPEEDS[speedIx][0]+"×";this.setAttribute("aria-label","Flyover speed "+SPEEDS[speedIx][0]+"x");
};

document.getElementById("b-reset").onclick=()=>{
  if(!route || !map) return;
  /* only moves the camera: a playing flyover keeps playing and the camera snaps back behind the walker */
  userOverride=false;camMode="follow";showCam();
  camCenter=null;camBearing=null;
  if(playing){ currentZoom=START_ZOOM;targetZoom=START_ZOOM; return; }
  if(homeView) map.fitBounds(homeView.b,{padding:homePad(),pitch:HOME_PITCH,bearing:homeView.bearing,duration:900});
};

document.getElementById("b-cam").onclick=function(){
  camMode = (camMode === "follow") ? "topdown" : "follow";
  showCam();
  userOverride=false;camCenter=null;camBearing=null;
  currentZoom=START_ZOOM;targetZoom=START_ZOOM;
  if(!playing && map) map.easeTo({pitch: camMode==="topdown" ? 0 : HOME_PITCH, duration:700});
};

document.getElementById("b-lay").onclick=function(){
  osVisible=!osVisible;
  this.classList.toggle("on",osVisible);
  if(map) map.setLayoutProperty("os-topo-layer","visibility",osVisible?"visible":"none");
};

function syncFs(){
  const on=!!isFullscreen();
  document.body.classList.toggle("fs",on||document.body.classList.contains("ios-fullscreen"));
  document.getElementById("i-exp").style.display=on?"none":"block";
  document.getElementById("i-col").style.display=on?"block":"none";
  if(map) setTimeout(()=>map.resize(),60);
}
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,syncFs));

/* on a Lost Peak page: ask the page to grow this map to fill the screen (same as the Ethels map); works on iPhone too */
/* phones (Rem, 22 Oct 2026): two-finger moving inside the page was jittery, so on a phone the map stays still while
   the page scrolls; tap it to open it full screen, where one finger moves it as normal */
const LP_TOUCH = matchMedia("(pointer:coarse)").matches && window.self !== window.top && !document.body.classList.contains("ios-fullscreen");
function lpGestures(on){
  if(!map) return;
  ["dragPan","touchZoomRotate","dragRotate","touchPitch","doubleClickZoom","scrollZoom"].forEach(h=>{ try{ on ? map[h].enable() : map[h].disable(); }catch(e){} });
  document.body.classList.toggle("lp-locked", !on);
}
const EMBEDDED = window.self !== window.top;
let pageFs = false;
function setPageFs(on){
  pageFs = on;
  /* full screen: one finger moves the map again */
  if(map && matchMedia("(pointer:coarse)").matches && !document.body.classList.contains("ios-fullscreen")){
    if(LP_TOUCH) lpGestures(on);
  }
  document.body.classList.toggle("fs", on);
  document.getElementById("i-exp").style.display = on ? "none" : "block";
  document.getElementById("i-col").style.display = on ? "block" : "none";
  document.getElementById("b-fs").setAttribute("aria-label", on ? "Exit fullscreen" : "Fullscreen");
  try{ window.parent.postMessage({type:"lpFs", on:on}, "*"); }catch(e){}
  if(map){ setTimeout(()=>map.resize(),60); setTimeout(()=>map.resize(),400); }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && pageFs) setPageFs(false); });
document.getElementById("b-fs").onclick=()=>{
  if(EMBEDDED){ setPageFs(!pageFs); return; }
  if(isIOS()){
    const url = new URL(window.location.href);
    url.searchParams.set("fs","1");
    window.open(url.toString(), "_blank");
    return;
  }
  if(!isFullscreen()){
    const el=document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }else{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};

/* zoom buttons: change the flyover distance without stopping it (fingers stop it) */
function lpZoom(d){
  if(!map) return;
  if(playing && (camMode==="follow"||camMode==="topdown")){
    userOverride=false;
    targetZoom=Math.max(11,Math.min(18,targetZoom+d));
  }else{
    map.easeTo({zoom:map.getZoom()+d,duration:300});
  }
}
document.getElementById("b-zin").onclick=()=>lpZoom(0.7);
document.getElementById("b-zout").onclick=()=>lpZoom(-0.7);

function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;

  if(playing && route && map){
    const speed=SPEEDS[speedIx][1];
    progress+=speed*dt*0.28;
    if(progress>routeLen) progress=0;

    const pos=turf.along(route,progress,{units:"kilometers"}).geometry.coordinates;
    const nxt=turf.along(route,Math.min(progress+0.01,routeLen),{units:"kilometers"}).geometry.coordinates;

    map.getSource("cursor").setData(turf.point(pos));
    sendProg(false);

    if((camMode==="follow" || camMode==="topdown") && !userOverride){
      const targetCenter=pos;

      const fwd = turf.bearing(turf.point(pos),turf.point(nxt));
      const targetBearing = normBearing(fwd + BEARING_OFFSET_DEG);

      const targetPitch=camMode==="topdown"?0:75;

      if(camBearing===null) camBearing=targetBearing;
      const diff=((targetBearing-camBearing+540)%360)-180;
      camBearing+=Math.max(-MAX_TURN_RATE*dt,Math.min(MAX_TURN_RATE*dt,diff));

      if(!camCenter) camCenter=targetCenter;
      camCenter=[
        camCenter[0]+(targetCenter[0]-camCenter[0])*CENTER_SMOOTH,
        camCenter[1]+(targetCenter[1]-camCenter[1])*CENTER_SMOOTH
      ];

      const dz = targetZoom - currentZoom;
      const zoomLerp = Math.min(1, 3*dt);
      currentZoom = currentZoom + dz*zoomLerp;

      map.jumpTo({
        center:camCenter,
        bearing:camBearing,
        pitch:targetPitch,
        zoom:currentZoom
      });
    }
  }

  requestAnimationFrame(tick);
}

</script>
