<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Snowdon Via The Llanberis Path 3D Flyover</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== FLYOVER BUTTONS (matches The Ethels map flyover) ===== */
html,body{margin:0;height:100%;background:#000;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#map{position:absolute;inset:0}
.ui{position:absolute;top:50%;transform:translateY(-50%);z-index:10;display:flex!important;flex-direction:column;gap:14px}
.ui-left{left:20px}
.ui-right{right:20px}
.btn{width:50px;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:.15s;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}
@supports((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.btn{background:rgba(255,255,255,.28)}}
@media(hover:hover){.btn:hover{background:rgba(56,153,236,.35)}}
.btn:focus{outline:0}
.btn svg{fill:#1c1c1e;width:24px;height:24px;display:none}
.btn svg.active{display:block}
.speed-wrap{position:relative;width:50px;height:50px}
.speed-panel{position:absolute;top:50%;right:60px;transform:translateY(-50%) scale(.98);opacity:0;pointer-events:none;width:220px;height:44px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:9999px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);transition:opacity .18s,transform .18s;box-shadow:inset 0 1px 1px rgba(255,255,255,.85),0 4px 14px rgba(0,0,0,.28);box-sizing:border-box}
.speed-wrap.open .speed-panel{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
@supports((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.speed-panel{background:rgba(255,255,255,.28)}}
.speed-slider{flex:1;appearance:none;-webkit-appearance:none;height:6px;border-radius:999px;background:rgba(0,0,0,.22);outline:0}
.speed-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #1c1c1e;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.speed-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #1c1c1e;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.btn.fv-free{background:linear-gradient(180deg,#3899ec,#297fc8)!important;animation:fv-pulse 1.4s ease-in-out infinite}
@keyframes fv-pulse{0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 6px rgba(56,153,236,.35),0 3px 10px rgba(0,0,0,.35)}}
#btnReset,#btnMobileMenu{display:none!important}

/* Fullscreen button (bottom right, like The Ethels map) */
.fs-btn{position:absolute;bottom:50px;right:20px;z-index:10;width:50px;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:.15s;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}
@supports((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.fs-btn{background:rgba(255,255,255,.28)}}
@media(hover:hover){.fs-btn:hover{background:rgba(56,153,236,.35)}}
.fs-btn:focus{outline:0}
.fs-btn:active{background:rgba(255,255,255,.45)}
.fs-btn svg{fill:none;stroke:#1c1c1e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px;display:block;filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))}
.mapboxgl-ctrl-attrib{position:absolute;bottom:5px;right:6px}

body.fake-fullscreen #map{position:fixed;inset:0;z-index:1}
body.fake-fullscreen .ui,body.fake-fullscreen #btnFull{z-index:2}

@media(max-width:767px){
  body:not(.ios-fullscreen) .btn{width:36px;height:36px;border:none}
  body:not(.ios-fullscreen) .btn svg{width:23px;height:23px}
  body:not(.ios-fullscreen) .ui{gap:10px}
  .ui-left{left:16px}
  .ui-right{right:16px}
  body:not(.ios-fullscreen) .speed-wrap{width:36px;height:36px}
  body:not(.ios-fullscreen) .speed-panel{height:36px;right:46px;width:185px;border:none}
  body:not(.ios-fullscreen) #btnFull{width:38px;height:38px;right:11px;bottom:49px}
  body:not(.ios-fullscreen) #btnFull svg{width:16px;height:16px}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="ui ui-left">
  <button id="btnToggle" class="btn" title="Play / Pause"><svg id="iconPlay" class="active" viewBox="0 0 24 24"><polygon transform="translate(1,0)" points="5,3 19,12 5,21"/></svg><svg id="iconPause" viewBox="0 0 24 24"><rect x="6" y="4" width="5" height="16" rx="1.5"/><rect x="13" y="4" width="5" height="16" rx="1.5"/></svg></button>
  <button id="btnRestart" class="btn" title="Restart"><svg id="iconRestart" class="active" viewBox="0 0 24 24" style="transform:translateX(2px)"><path d="M5 4v5h5" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9a7 7 0 1 1-1.5 4.3" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="btnReset" class="btn" title="Reset camera"><svg id="iconResetView" class="active" viewBox="0 0 24 24"></svg></button>
  <button id="btnCam" class="btn" title="Toggle camera"><svg id="iconCamCine" class="active" viewBox="0 0 24 24"><rect x="3" y="7" width="11" height="10" rx="2"/><polygon points="16,10 22,7.5 22,16.5 16,14"/></svg><svg id="iconCamBird" viewBox="4.3 6.3 43.9 40.4" style="transform:translate(1px,1px)"><path fill="#fff" d="M41.965,20.694c-0.495-2.083-2.273-3.54-4.182-3.54c-1.816,0-3.717,1.149-5.184,2.522c-3.911-5.328-9.661-9.706-13.112-12.527c-0.713,1.656-1.029,3.449-1.029,5.271c0,1.999,0.395,4.832,1.042,6.768L26,19.667H5.121c2.5,5.762,7.472,9.976,13.329,12.333c-3.699,2.583-6.778,4.415-10.271,6.815c2.034,2.034,3.384,2.935,6.606,4.035c2.205-3.185,3.991-5.396,5.582-7.654c2.219,0.988,4.734,1.532,7.207,1.532c11.183,0,14.263-12.188,14.509-14.603c0.972-0.161,1.946-0.328,2.918-0.455C43.971,21.4,42.953,21.075,41.965,20.694z"/></svg><svg id="iconCamFree" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="#fff"/><line x1="12" y1="2" x2="12" y2="6" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="18" x2="12" y2="22" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="12" x2="6" y2="12" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="12" x2="22" y2="12" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<div class="ui ui-right">
  <button id="btnZoomIn" class="btn" title="Zoom in"><svg id="iconZoomIn" class="active" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="#1c1c1e" stroke-width="2" fill="none"/><line x1="11" y1="8" x2="11" y2="14" stroke="#1c1c1e" stroke-width="2"/><line x1="8" y1="11" x2="14" y2="11" stroke="#1c1c1e" stroke-width="2"/><line x1="16" y1="16" x2="21" y2="21" stroke="#1c1c1e" stroke-width="2"/></svg></button>
  <button id="btnZoomOut" class="btn" title="Zoom out"><svg id="iconZoomOut" class="active" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="#1c1c1e" stroke-width="2" fill="none"/><line x1="8" y1="11" x2="14" y2="11" stroke="#1c1c1e" stroke-width="2"/><line x1="16" y1="16" x2="21" y2="21" stroke="#1c1c1e" stroke-width="2"/></svg></button>
  <button id="btnLayers" class="btn" title="Switch basemap"><svg id="iconLayersIcon" class="active" viewBox="0 0 24 24"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="2 15.5 12 22 22 15.5" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="speed-wrap" id="speedWrap">
    <button id="btnSpeed" class="btn" title="Speed"><svg id="iconSpeedIcon" class="active" viewBox="0 0 24 24"><path d="M4 5l8 7-8 7V5zm9 0l8 7-8 7V5z"/></svg></button>
    <div class="speed-panel" id="speedPanel"><input id="speed" class="speed-slider" type="range" min="0.1" max="5" step="0.05" value="0.35"></div>
  </div>
</div>

<button id="btnFull" class="fs-btn" title="Fullscreen"><svg id="fsIconExpand" viewBox="0 0 24 24" style="display:block"><polyline points="4,9 4,4 9,4"/><polyline points="20,9 20,4 15,4"/><polyline points="4,15 4,20 9,20"/><polyline points="20,15 20,20 15,20"/></svg><svg id="fsIconCollapse" viewBox="0 0 24 24" style="display:none"><polyline points="9,4 4,4 4,9"/><polyline points="15,4 20,4 20,9"/><polyline points="9,20 4,20 4,15"/><polyline points="15,20 20,20 20,15"/></svg></button>

<button id="btnMobileMenu" class="btn mobile-menu-btn"><svg id="iconMobileMenu" class="active" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg></button>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.0/dist/togeojson.umd.js"></script>

<script>
mapboxgl.accessToken="pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

const GPX_URL="https://raw.githubusercontent.com/remmiagbebi-beep/yr-wddfa-flyover/main/Snowdon%20Via%20The%20Llanberis%20Path.gpx";

/* Issue 2: flip camera so it is behind the walker looking forwards */
const BEARING_OFFSET_DEG = 180;

const START_ZOOM=15.7,
      CENTER_SMOOTH=0.06,
      MAX_TURN_RATE=4,
      STEP_KM=0.02;

let currentZoom = START_ZOOM;
let targetZoom  = START_ZOOM;

function forceWhite(svg){
  svg.querySelectorAll("*").forEach(n=>{
    if(n.getAttribute("fill")!=="none") n.setAttribute("fill","#fff");
    if(n.hasAttribute("stroke")) n.setAttribute("stroke","#fff");
  });
}

async function fetchText(u){
  try{const r=await fetch(u);if(r.ok)return await r.text();}catch(e){}
  try{const r=await fetch("https://corsproxy.io/?"+encodeURIComponent(u));if(r.ok)return await r.text();}catch(e){}
  return "";
}
function parseGpx(text){
  const xml=new DOMParser().parseFromString(text,"application/xml");
  return toGeoJSON.gpx(xml).features.find(f=>f.geometry?.type==="LineString");
}
function normBearing(b){
  const x = (b % 360 + 360) % 360;
  return x;
}

/* FAST FORWARD ICON */
(async()=>{
  try{
    const r=await fetch("https://raw.githubusercontent.com/remmiagbebi-beep/yr-wddfa-flyover/main/icons/fast-forward.svg");
    const t=await r.text();
    const svg=new DOMParser().parseFromString(t,"image/svg+xml").querySelector("svg");
    if(svg){
      forceWhite(svg);
      svg.id="iconSpeed";
      svg.classList.add("active");
      svg.style.width="18px";
      svg.style.height="18px";
      document.getElementById("iconSpeed").replaceWith(svg);
    }
  }catch(e){}
})();

/* LAYERS ICON */
(async()=>{
  try{
    const r=await fetch("https://raw.githubusercontent.com/remmiagbebi-beep/yr-wddfa-flyover/main/icons/layers.svg");
    const t=await r.text();
    const svg=new DOMParser().parseFromString(t,"image/svg+xml").querySelector("svg");
    if(svg){
      forceWhite(svg);
      svg.id="iconLayers";
      svg.classList.add("active");
      svg.style.width="24px";
      svg.style.height="24px";
      document.getElementById("iconLayers").replaceWith(svg);
    }
  }catch(e){}
})();

let map=null;
let route=null,routeLen=0,progress=0,playing=false,camMode="follow";
let userOverride=false;
let camCenter=null,camBearing=null,lastTs=0;
let osVisible=false;

async function addArrow(){
  if(map.hasImage("arrow"))return;
  const c=document.createElement("canvas");
  c.width=c.height=96;
  const ctx=c.getContext("2d");
  ctx.translate(48,48);
  ctx.beginPath();
  ctx.moveTo(40,0);
  ctx.lineTo(-24,-25);
  ctx.lineTo(-24,25);
  ctx.closePath();
  ctx.strokeStyle="#EC2629";
  ctx.fillStyle="#fff";
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fill();
  map.addImage("arrow",await createImageBitmap(c),{pixelRatio:2});
}

function camIcons(){
  return{
    follow:document.getElementById("iconCamCine"),
    topdown:document.getElementById("iconCamBird")
  };
}

function isFullscreen(){
  return document.fullscreenElement || document.webkitFullscreenElement ||
         document.mozFullScreenElement || document.msFullscreenElement;
}

function isIOS(){
  const ua = window.navigator.userAgent || "";
  const platform = window.navigator.platform || "";
  const iOS = /iPad|iPhone|iPod/.test(ua);
  const iPadOS = platform === "MacIntel" && navigator.maxTouchPoints > 1;
  return iOS || iPadOS;
}

/* Detect iOS fullscreen tab via ?fs=1 and set class */
(function(){
  const params = new URLSearchParams(window.location.search);
  if(isIOS() && params.get("fs") === "1"){
    document.body.classList.add("ios-fullscreen");
    const bf = document.getElementById("btnFull");
    if(bf) bf.style.display = "none";
  }
})();

/* Issue 1: load GPX first, then create map centred on this route */
(async()=>{
  const gpxText = await fetchText(GPX_URL);
  const line = parseGpx(gpxText);

  let initialCenter = [-4.128, 53.118];
  let initialZoom = 13.5;
  let initialBearing = -20;

  if(line){
    const b = turf.bbox(line);
    initialCenter = [(b[0]+b[2])/2, (b[1]+b[3])/2];

    const coords = line.geometry.coordinates || [];
    if(coords.length >= 2){
      const fwd = turf.bearing(turf.point(coords[0]), turf.point(coords[1]));
      initialBearing = normBearing(fwd + BEARING_OFFSET_DEG);
    }
  }

  map=new mapboxgl.Map({
    container:"map",
    style:"mapbox://styles/mapbox/satellite-streets-v12",
    center:initialCenter,
    zoom:initialZoom,
    pitch:75,
    bearing:initialBearing,
    antialias:true,
    attributionControl:false
  });

  /* COMPACT ATTRIBUTION (Mapbox logo bottom left + info icon) */
  map.addControl(new mapboxgl.AttributionControl({ compact: true }), "bottom-right");

  /* user override detection needs map instance */
  ["mousedown","touchstart","dragstart","rotatestart","zoomstart","pitchstart"].forEach(ev=>{
    map.on(ev,e=>{
      if(!e.originalEvent) return;
      if(playing && (camMode==="follow"||camMode==="topdown")){
        userOverride=true;
      }
    });
  });

  map.on("load",async()=>{

    map.addSource("mapbox-dem",{type:"raster-dem",url:"mapbox://mapbox.mapbox-terrain-dem-v1"});
    map.setTerrain({source:"mapbox-dem",exaggeration:1});
    map.addLayer({id:"sky",type:"sky",
      paint:{"sky-type":"atmosphere","sky-atmosphere-sun-intensity":12}
    });

    map.addSource("os-topo",{
      type:"raster",
      tiles:[
        "https://a.tile.opentopomap.org/{z}/{x}/{y}.png",
        "https://b.tile.opentopomap.org/{z}/{x}/{y}.png",
        "https://c.tile.opentopomap.org/{z}/{x}/{y}.png"
      ],
      tileSize:256,
      maxzoom:17
    });
    map.addLayer({
      id:"os-topo-layer",
      type:"raster",
      source:"os-topo",
      layout:{ visibility:"none" },
      paint:{}
    });

    map.addSource("route",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({
      id:"route-line",
      type:"line",
      source:"route",
      paint:{
        "line-color":"#EC2629",
        "line-width":4,
        "line-opacity":0.95
      }
    });

    await addArrow();

    map.addLayer({
      id:"route-arrows",
      type:"symbol",
      source:"route",
      layout:{
        "symbol-placement":"line",
        "symbol-spacing":110,
        "icon-image":"arrow",
        "icon-size":0.45,
        "icon-allow-overlap":true,
        "icon-ignore-placement":true,
        "icon-rotation-alignment":"map",
        "icon-keep-upright":false
      },
      paint:{"icon-opacity":0.9}
    });

    map.addSource("cursor",{type:"geojson",data:turf.point([0,0])});
    map.addLayer({
      id:"cursor-pt",
      type:"circle",
      source:"cursor",
      paint:{
        "circle-radius":6,
        "circle-color":"#fff",
        "circle-stroke-width":3,
        "circle-stroke-color":"#EC2629"
      }
    });

    if(line){
      const len=turf.length(line,{units:"kilometers"});
      const pts=[];
      for(let d=0;d<=len;d+=STEP_KM){
        pts.push(
          turf.along(line,Math.min(d,len),{units:"kilometers"}).geometry.coordinates
        );
      }
      route={type:"Feature",geometry:{type:"LineString",coordinates:pts}};
      routeLen=len;

      map.getSource("route").setData(route);
      map.getSource("cursor").setData(turf.point(pts[0]));

      map.once("idle",()=>{
        const b=turf.bbox(route);

        let fitBearing = initialBearing;
        if(pts.length >= 2){
          const fwd = turf.bearing(turf.point(pts[0]), turf.point(pts[1]));
          fitBearing = normBearing(fwd + BEARING_OFFSET_DEG);
        }

        map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{
          padding:80,pitch:75,bearing:fitBearing,duration:0
        });

        currentZoom = START_ZOOM;
        targetZoom  = START_ZOOM;
        camBearing = fitBearing;
      });
    }

    requestAnimationFrame(tick);
  });
})();

document.getElementById("btnToggle").onclick=()=>{
  playing=!playing;
  if(playing){
    userOverride=false;
    camCenter=null;
    camBearing=null;
    currentZoom = START_ZOOM;
    targetZoom  = START_ZOOM;
  }
  document.getElementById("iconPlay").classList.toggle("active",!playing);
  document.getElementById("iconPause").classList.toggle("active",playing);
};

document.getElementById("btnRestart").onclick=()=>{
  if(!route || !map) return;
  progress=0;
  const startCoord=route.geometry.coordinates[0];
  map.getSource("cursor").setData(turf.point(startCoord));
  camCenter=null;
  camBearing=null;
  currentZoom = START_ZOOM;
  targetZoom  = START_ZOOM;
};

document.getElementById("btnReset").onclick=()=>{
  if(!route) return;
  userOverride=false;
  camMode="follow";
  camCenter=null;
  camBearing=null;
  const icons=camIcons();
  Object.values(icons).forEach(i=>i.classList.remove("active"));
  icons.follow.classList.add("active");
  currentZoom = START_ZOOM;
  targetZoom  = START_ZOOM;
};

document.getElementById("btnCam").onclick=()=>{
  camMode = (camMode === "follow") ? "topdown" : "follow";
  const icons=camIcons();
  Object.values(icons).forEach(i=>i.classList.remove("active"));
  icons[camMode].classList.add("active");

  userOverride=false;
  camCenter=null;
  camBearing=null;
  currentZoom = START_ZOOM;
  targetZoom  = START_ZOOM;
};

document.getElementById("btnLayers").onclick=()=>{
  osVisible=!osVisible;
  if(map) map.setLayoutProperty("os-topo-layer","visibility",osVisible?"visible":"none");
};

const speedWrap=document.getElementById("speedWrap");
document.getElementById("btnSpeed").onclick=e=>{
  e.stopPropagation();
  speedWrap.classList.toggle("open");
};
document.addEventListener("click",()=>speedWrap.classList.remove("open"));

document.getElementById("btnFull").onclick=()=>{
  if(isIOS()){
    const url = new URL(window.location.href);
    url.searchParams.set("fs","1");
    window.open(url.toString(), "_blank");
    return;
  }

  if(!isFullscreen()){
    const el=document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
    else if(el.msRequestFullscreen) el.msRequestFullscreen();
  }else{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
    else if(document.msExitFullscreen) document.msExitFullscreen();
  }
};

document.getElementById("btnZoomIn").onclick=()=>{
  if(!map) return;
  const delta=0.7;
  if(playing && (camMode==="follow"||camMode==="topdown") && !userOverride){
    targetZoom = Math.min(targetZoom + delta, 19);
  }else{
    const z = map.getZoom()+delta;
    map.easeTo({ zoom:z, duration:600 });
    currentZoom = z;
    targetZoom  = z;
  }
};
document.getElementById("btnZoomOut").onclick=()=>{
  if(!map) return;
  const delta=0.7;
  if(playing && (camMode==="follow"||camMode==="topdown") && !userOverride){
    targetZoom = Math.max(targetZoom - delta, 4);
  }else{
    const z = map.getZoom()-delta;
    map.easeTo({ zoom:z, duration:600 });
    currentZoom = z;
    targetZoom  = z;
  }
};

function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;

  if(playing && route && map){
    const speed=parseFloat(document.getElementById("speed").value||"0.35");
    progress+=speed*dt*0.28;
    if(progress>routeLen) progress=0;

    const pos=turf.along(route,progress,{units:"kilometers"}).geometry.coordinates;
    const nxt=turf.along(route,Math.min(progress+0.01,routeLen),{units:"kilometers"}).geometry.coordinates;

    map.getSource("cursor").setData(turf.point(pos));

    if((camMode==="follow" || camMode==="topdown") && !userOverride){
      const targetCenter=pos;

      const fwd = turf.bearing(turf.point(pos),turf.point(nxt));
      const targetBearing = normBearing(fwd + BEARING_OFFSET_DEG);

      const targetPitch=camMode==="topdown"?0:75;

      if(camBearing===null) camBearing=targetBearing;
      const diff=((targetBearing-camBearing+540)%360)-180;
      camBearing+=Math.max(-MAX_TURN_RATE*dt,Math.min(MAX_TURN_RATE*dt,diff));

      if(!camCenter) camCenter=targetCenter;
      camCenter=[
        camCenter[0]+(targetCenter[0]-camCenter[0])*CENTER_SMOOTH,
        camCenter[1]+(targetCenter[1]-camCenter[1])*CENTER_SMOOTH
      ];

      const dz = targetZoom - currentZoom;
      const zoomLerp = Math.min(1, 3*dt);
      currentZoom = currentZoom + dz*zoomLerp;

      map.jumpTo({
        center:camCenter,
        bearing:camBearing,
        pitch:targetPitch,
        zoom:currentZoom
      });
    }
  }

  requestAnimationFrame(tick);
}

/* MOBILE MENU TOGGLE – Layers + Speed in vertical stack on mobile,
   menu stays separate in bottom right */
(function(){
  const btnMobileMenu = document.getElementById("btnMobileMenu");
  const uiLeft = document.querySelector(".ui-left");
  const uiRight = document.querySelector(".ui-right");
  if(!btnMobileMenu || !uiLeft || !uiRight) return;

  const isMobile = window.matchMedia("(max-width: 767px)").matches;

  function setControlsVisible(v){
    const disp = v ? "flex" : "none";
    uiLeft.style.display = disp;
    uiRight.style.display = disp;
  }

  if(isMobile){
    const speedWrapEl  = document.getElementById("speedWrap");
    const layersBtnEl  = document.getElementById("btnLayers");

    if(layersBtnEl){
      uiLeft.appendChild(layersBtnEl);
    }
    if(speedWrapEl){
      uiLeft.appendChild(speedWrapEl);
    }

    btnMobileMenu.style.display = "flex";
    setControlsVisible(false);
    let visible = false;
    btnMobileMenu.addEventListener("click",()=>{
      visible = !visible;
      setControlsVisible(visible);
    });
  }else{
    setControlsVisible(true);
    btnMobileMenu.style.display = "none";
  }
})();
</script>

<script>
/* ===== Ethels-style flyover controls: keep buttons in two side columns, free-camera state, fullscreen icon ===== */
(function(){
  const $=id=>document.getElementById(id);
  const right=document.querySelector(".ui-right");
  if(right){ right.appendChild($("btnLayers")); right.appendChild($("speedWrap")); }

  const cam=$("btnCam"), free=$("iconCamFree"), cine=$("iconCamCine"), bird=$("iconCamBird");
  let last=null;
  function sync(){
    const f=(typeof userOverride!=="undefined")&&!!userOverride;
    if(f!==last){
      last=f;
      cam.classList.toggle("fv-free",f);
      free.classList.toggle("active",f);
      cine.style.display=f?"none":"";
      bird.style.display=f?"none":"";
      cam.title=f?"Return camera to route":"Toggle camera";
    }
    requestAnimationFrame(sync);
  }
  requestAnimationFrame(sync);

  /* When the camera is free (user moved the map), the camera button snaps it back to the route */
  window.addEventListener("click",e=>{
    if(!(e.target&&e.target.closest&&e.target.closest("#btnCam"))) return;
    if((typeof userOverride!=="undefined")&&userOverride){
      e.stopPropagation(); e.preventDefault();
      const sw=$("speedWrap"); if(sw) sw.classList.remove("open");
      const r=$("btnReset"); if(r&&r.onclick) r.onclick();
    }
  },true);

  function fsIcons(){
    const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
    $("fsIconExpand").style.display=on?"none":"block";
    $("fsIconCollapse").style.display=on?"block":"none";
  }
  document.addEventListener("fullscreenchange",fsIcons);
  document.addEventListener("webkitfullscreenchange",fsIcons);
})();
</script>
